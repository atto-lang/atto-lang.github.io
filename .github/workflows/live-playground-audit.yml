name: Live public playground security and MIME audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/check-live-playground.mjs'
      - '.github/scripts/check-live-playground.test.mjs'
      - '.github/workflows/live-playground-audit.yml'
      - 'play/**'
  push:
    branches: [main]
  schedule:
    - cron: '17 12 * * *'
permissions:
  contents: read
jobs:
  live-https-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check exact audited PR head and unit contracts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          node --test .github/scripts/check-live-playground.test.mjs
      - name: Fetch and verify current public GitHub Pages HTTP assets (release blocker until green)
        run: node .github/scripts/check-live-playground.mjs
