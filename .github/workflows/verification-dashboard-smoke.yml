name: Read-only verification dashboard smoke
on:
  pull_request:
    paths:
      - 'verification/**'
      - '.github/workflows/verification-dashboard-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-safety-and-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, immutable
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, immutable
        with:
          node-version: '22'
      - name: Assert exact checked-out PR head and no data exports
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          test -s verification/index.html
          test -s verification/tests/site.test.mjs
      - name: Offline site security and fail-closed regression tests
        run: node --test verification/tests/*.test.mjs
