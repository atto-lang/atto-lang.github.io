name: Live public AttoLang playground release audit
on:
  workflow_dispatch:
  schedule:
    - cron: '27 5 * * *'
  workflow_run:
    workflows:
      - Approved public AttoLang playground release
    types: [completed]
permissions:
  contents: read
concurrency:
  group: atto-public-pages-live-http-audit
  cancel-in-progress: false
jobs:
  live-http-audit:
    # On workflow_run, only audit a completed authorized manual release of main;
    # scheduled/manual checks may independently report NOT_CERTIFIED.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Bind local audit code to exact source
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD^{tree}
      - name: Execute live HTTPS digest, MIME, CSP and negative-path audit
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          ATTO_PUBLIC_COMPILER_SHA256: ${{ vars.ATTO_PUBLIC_COMPILER_SHA256 }}
        run: |
          node .github/scripts/audit-live-playground.mjs
