name: Approved public AttoLang playground release
on:
  push:
    paths:
      - 'play/**'
      - '.github/scripts/**'
      - '.github/workflows/approved-playground-pages.yml'
  pull_request:
    paths:
      - 'play/**'
      - '.github/scripts/**'
      - '.github/workflows/approved-playground-pages.yml'
  workflow_dispatch:
    inputs:
      approved_compiler_sha256:
        description: Reviewed compiler SHA-256 to disclose publicly
        required: true
        type: string
      confirm_public_disclosure:
        description: Confirm publishing this binary to GitHub Pages
        required: true
        type: choice
        options: ['no', 'yes']
permissions:
  contents: read
concurrency:
  group: approved-public-playground
  cancel-in-progress: false
jobs:
  verify-public-artifact:
    runs-on: ubuntu-24.04
    # Read-only administration observations for dispatch-only preflight.
    # No Pages/Actions write permission is granted to verification.
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Require exact source SHA and execute release-package tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          node --test .github/scripts/*.test.mjs
      - name: Verify live GitHub branch, Pages, and environment governance
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/verify-release-governance.mjs
      - name: Enforce independently approved public compiler digest on deploy
        if: github.event_name == 'workflow_dispatch'
        env:
          REVIEWED_SHA: ${{ vars.ATTO_PUBLIC_COMPILER_SHA256 }}
          REQUESTED_SHA: ${{ inputs.approved_compiler_sha256 }}
          CONFIRMED: ${{ inputs.confirm_public_disclosure }}
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = atto-lang/atto-lang.github.io
          test "$CONFIRMED" = yes
          case "$REVIEWED_SHA" in
            ''|*[!0-9a-f]*) echo 'Missing or malformed administrator release approval'; exit 1 ;;
          esac
          test "${#REVIEWED_SHA}" -eq 64
          test "$REVIEWED_SHA" = "$REQUESTED_SHA"
          test "$REVIEWED_SHA" = "$(sha256sum play/public/atto_compiler.wasm | cut -d' ' -f1)"
      - name: Run real Wasm and Chromium tests
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          npm --prefix play test
          npm --prefix play run test:browser
          npm --prefix play run test:e2e
      - name: Stage allowlisted production assets and rerun Chromium
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          APPROVED_COMPILER_SHA256: ${{ github.event_name == 'workflow_dispatch' && vars.ATTO_PUBLIC_COMPILER_SHA256 || '' }}
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node .github/scripts/package-playground.mjs
          ATTO_STATIC_ROOT="$PWD/_site/play" npm --prefix play run test:e2e
          cmp play/public/atto_compiler.wasm _site/play/public/atto_compiler.wasm
          test -s _site/release-manifest.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'atto-lang/atto-lang.github.io' && inputs.confirm_public_disclosure == 'yes'
    needs: verify-public-artifact
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
