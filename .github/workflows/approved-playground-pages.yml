name: Approved public AttoLang playground release
on:
  # Both checks are required on all PRs. Path filters leave required checks pending.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      approved_compiler_sha256:
        description: Reviewed compiler SHA-256 to disclose publicly
        required: true
        type: string
      confirm_public_disclosure:
        description: Confirm publishing this binary to GitHub Pages
        required: true
        type: choice
        options: ['no', 'yes']
permissions:
  contents: read
concurrency:
  # Distinct PRs must not starve an approved manual release; only latest PR
  # head matters. Main push and dispatch still share one release queue.
  group: approved-public-playground-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify-public-artifact:
    runs-on: ubuntu-24.04
    # PR-mode is read-only; dispatch preflight may GET governance endpoints.
    permissions:
      contents: read
      actions: read
      pages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Require exact source SHA and execute release-package tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          node --test .github/scripts/*.test.mjs
          node --test play/architecture/tests/*.test.mjs
          node play/architecture/scripts/verify.mjs
          node play/architecture/scripts/smoke-node.mjs
      - name: Verify live GitHub branch, Pages, and environment governance
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/verify-release-governance.mjs
      - name: Verify Pages source cannot auto-publish from a branch
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-pages-source.mjs
      - name: Verify deployment environment has independent required reviewers
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-deployment-environment.mjs
      - name: Verify independent PR approval for exact public main
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-reviewed-release.mjs
      - name: Enforce independently approved public compiler digest on deploy
        if: github.event_name == 'workflow_dispatch'
        env:
          REVIEWED_SHA: ${{ vars.ATTO_PUBLIC_COMPILER_SHA256 }}
          REQUESTED_SHA: ${{ inputs.approved_compiler_sha256 }}
          CONFIRMED: ${{ inputs.confirm_public_disclosure }}
        run: node .github/scripts/check-approved-compiler.mjs
      - name: Run real Wasm and Chromium tests
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          npm --prefix play test
          npm --prefix play run test:browser
          npm --prefix play run test:e2e
      - name: Validate the eleven-paper publication source
        run: node scripts/check-whitepapers.mjs
      - name: Build reviewed documentation with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./
          destination: ./_whitepapers-build
      - name: Validate rendered documentation before publication
        env:
          ATTO_RENDERED_SITE_ROOT: _whitepapers-build
        run: node scripts/check-whitepapers-build.mjs
      - name: Stage allowlisted production assets and rerun Chromium
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          APPROVED_COMPILER_SHA256: ${{ github.event_name == 'workflow_dispatch' && vars.ATTO_PUBLIC_COMPILER_SHA256 || '' }}
          ATTO_RENDERED_SITE_ROOT: _whitepapers-build
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node .github/scripts/package-playground.mjs
          ATTO_STATIC_ROOT="$PWD/_site/play" npm --prefix play run test:e2e
          cmp play/public/atto_compiler.wasm _site/play/public/atto_compiler.wasm
          test -s _site/whitepapers/index.html
          test -s _site/whitepapers/11-async-programming-and-structured-concurrency.html
          test -s _site/whitepapers/assets/11-structured-concurrency.svg
          test -s _site/index.html
          test -s _site/assets/site.css
          grep -q 'Open the playground' _site/index.html
          test -s _site/release-manifest.json
          node .github/scripts/verify-staged-release.mjs
      # A required PR check must prove the proposed merge tree works, not
      # only the contributor's head. Keep head evidence above as a separate
      # exact-source receipt; never package the synthetic merge for publication.
      - name: Check out proposed PR merge commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .pr-merge-check
          fetch-depth: 2
      # A merge checkout is a separate source tree. Render documentation
      # from that exact proposed merge, rather than borrowing head artifacts.
      - name: Build reviewed documentation from proposed merge
        if: github.event_name == 'pull_request'
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./.pr-merge-check
          destination: ./.pr-merge-check/_whitepapers-build
      - name: Verify proposed merge parents and execute integrated guest tests
        if: github.event_name == 'pull_request'
        working-directory: .pr-merge-check
        env:
          EXPECTED_MERGE_SHA: ${{ github.sha }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SOURCE_COMMIT: ${{ github.sha }}
          ATTO_RENDERED_SITE_ROOT: _whitepapers-build
        run: |
          set -eu
          test "$EXPECTED_MERGE_SHA" != "$EXPECTED_PR_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PR_BASE_SHA $EXPECTED_PR_HEAD_SHA"
          git rev-parse HEAD^{tree}
          node --test .github/scripts/*.test.mjs
          npm --prefix play test
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          npm --prefix play run test:browser
          npm --prefix play run test:e2e
          node scripts/check-whitepapers-build.mjs
          node .github/scripts/package-playground.mjs
          ATTO_STATIC_ROOT="$PWD/_site/play" npm --prefix play run test:e2e
          node .github/scripts/verify-staged-release.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'atto-lang/atto-lang.github.io' && inputs.confirm_public_disclosure == 'yes'
    needs: verify-public-artifact
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
      pull-requests: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Reverify exact protected main after environment approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node .github/scripts/verify-release-governance.mjs
      - name: Recheck active main release gates immediately before deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node .github/scripts/check-pages-source.mjs
      - name: Recheck protected deployment environment immediately before deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-deployment-environment.mjs
      - name: Recheck independent exact-main review after environment admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/check-reviewed-release.mjs
      - name: Recheck compiler approval after protected environment admission
        env:
          REVIEWED_SHA: ${{ vars.ATTO_PUBLIC_COMPILER_SHA256 }}
          REQUESTED_SHA: ${{ inputs.approved_compiler_sha256 }}
          CONFIRMED: ${{ inputs.confirm_public_disclosure }}
        run: node .github/scripts/check-approved-compiler.mjs
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      # A successful deploy-pages API call is NOT a release certificate.
      # Enforce the public bytes and forbidden-path gates in the same run,
      # allowing bounded time for GitHub Pages edge propagation.
      - name: Fail release workflow unless live HTTPS postflight passes
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          ATTO_PUBLIC_COMPILER_SHA256: ${{ vars.ATTO_PUBLIC_COMPILER_SHA256 }}
        run: |
          set -eu
          for attempt in 1 2 3 4 5 6 7 8; do
            if node .github/scripts/audit-live-playground.mjs; then
              echo "LIVE_HTTP_VERIFIED at exact release commit $EXPECTED_SOURCE_SHA"
              exit 0
            fi
            echo "NOT_CERTIFIED: public release postflight attempt $attempt failed" >&2
            if [ "$attempt" -lt 8 ]; then sleep 15; fi
          done
          echo "NOT_CERTIFIED: deployed site does not match the approved source/asset/denylist contract" >&2
          exit 1
