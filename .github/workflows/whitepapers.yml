name: AttoLang white-paper validation

on:
  pull_request:
    paths:
      - 'whitepapers/**'
      - 'scripts/check-whitepapers*.mjs'
      - 'README.md'
      - '_layouts/whitepaper.html'
      - '.github/workflows/whitepapers.yml'
  push:
    branches: [main]
    paths:
      - 'whitepapers/**'
      - 'scripts/check-whitepapers*.mjs'
      - 'README.md'
      - '_layouts/whitepaper.html'
      - '.github/workflows/whitepapers.yml'

permissions:
  contents: read

jobs:
  validate-publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "HEAD=$EXPECTED_HEAD"
          echo "TREE=$(git rev-parse HEAD^{tree})"
      - name: Validate white-paper source structure and accessibility metadata
        run: node scripts/check-whitepapers.mjs
      - name: Build the actual GitHub Pages Jekyll site
        uses: actions/jekyll-build-pages@v1.0.13
        with:
          source: ./
          destination: ./_site
          verbose: true
      - name: Verify rendered Jekyll output
        run: node scripts/check-whitepapers-build.mjs
