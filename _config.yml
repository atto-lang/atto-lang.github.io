# DEFENSE IN DEPTH FOR LEGACY JEKYLL PAGES MODE ONLY.
# The actual P0 remedy is Settings > Pages > Source: GitHub Actions.
# This prevents obvious non-release files from being copied by the legacy
# branch publisher, but MUST NOT be treated as release authorization.
exclude:
  - README.md
  - play/tests
  - play/package.json
  - play/package-lock.json
  - play/scripts
  - play/BUILD_RECEIPT.md
  - play/node
  - play/tools
  - play/release-candidates
  - play/architecture/scripts
  - play/architecture/tests
  - play/architecture/site-manifest.json
  - play/architecture/README.md
  - scripts
  - verification
  - node_modules
  - vendor
