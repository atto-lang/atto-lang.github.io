# DEFENSE IN DEPTH FOR LEGACY JEKYLL PAGES MODE ONLY.
# The actual P0 remedy is Settings > Pages > Source: GitHub Actions.
# This prevents obvious non-release files from being copied by the legacy
# branch publisher, but MUST NOT be treated as release authorization.
exclude:
  - README.md
  - play/tests
  - play/package.json
  - play/package-lock.json
  - play/scripts
  - play/BUILD_RECEIPT.md
  # Only docs/COMPILER_CONTRACT.md is deliberately public in the reviewed release.
  # Deny all other existing internal play/docs files in legacy Jekyll mode.
  - play/docs/BACKEND_MAP.md
  - play/docs/CLOSURES_RELEASE_GATE.md
  - play/docs/EXAMPLE_BACKEND_PARITY.md
  - play/docs/BROWSER_FETCH_ABI.md
  - play/src/browser-fetch-capability.js
  - play/docs/BROWSER_HTTP_RESUME_V1.md
  - play/src/browser-http-abi-v1.js
  - play/node
  - play/tools
  - play/release-candidates
  - play/architecture/scripts
  - play/architecture/tests
  - play/architecture/site-manifest.json
  - play/architecture/README.md
  - scripts
  - verification
  - node_modules
  - vendor
