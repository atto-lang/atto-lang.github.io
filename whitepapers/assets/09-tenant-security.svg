<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc"><title id="title">Defense in depth for tenant execution</title><desc id="desc">Language safety, actor isolation, VM boundaries, and OS controls are separate layers. No single boundary substitutes for the others; test hostile workloads at each layer.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1526"/><stop offset="1" stop-color="#101f32"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#80cfc3" stroke-width="1.5"/></marker></defs><rect width="1200" height="490" rx="24" fill="url(#bg)"/><text x="44" y="62" fill="#e8f0f7" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">Defense in depth for tenant execution</text><text x="44" y="96" fill="#a9bacd" font-family="Inter,Arial,sans-serif" font-size="17">Language safety, actor isolation, VM boundaries, and OS controls are separate layers.</text><rect x="34" y="155" width="265" height="235" rx="17" fill="#163344" stroke="#40566e" stroke-width="1.5"/><rect x="34" y="155" width="6" height="235" rx="3" fill="#73d7c7"/><circle cx="64" cy="187" r="15" fill="#73d7c7" opacity=".18"/><text x="64" y="193" text-anchor="middle" fill="#73d7c7" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">1</text><text x="56" y="237" fill="#f2f6fb" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">Identity</text><text x="56" y="280" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="16">Authenticate tenant</text><text x="56" y="311" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="16">Scope · expiry</text><path d="M304 273 H317" stroke="#80cfc3" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="323" y="155" width="265" height="235" rx="17" fill="#1b3048" stroke="#40566e" stroke-width="1.5"/><rect x="323" y="155" width="6" height="235" rx="3" fill="#91b8ff"/><circle cx="353" cy="187" r="15" fill="#91b8ff" opacity=".18"/><text x="353" y="193" text-anchor="middle" fill="#91b8ff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">2</text><text x="345" y="237" fill="#f2f6fb" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">Capabilities</text><text x="345" y="280" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="16">Minimum authority</text><text x="345" y="311" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="16">Explicit host imports</text><path d="M593 273 H606" stroke="#80cfc3" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="612" y="155" width="265" height="235" rx="17" fill="#203548" stroke="#40566e" stroke-width="1.5"/><rect x="612" y="155" width="6" height="235" rx="3" fill="#e1b36e"/><circle cx="642" cy="187" r="15" fill="#e1b36e" opacity=".18"/><text x="642" y="193" text-anchor="middle" fill="#e1b36e" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">3</text><text x="634" y="237" fill="#f2f6fb" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">Isolation</text><text x="634" y="280" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="16">Memory · registries</text><text x="634" y="311" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="16">Generation fences</text><path d="M882 273 H895" stroke="#80cfc3" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="901" y="155" width="265" height="235" rx="17" fill="#29334a" stroke="#40566e" stroke-width="1.5"/><rect x="901" y="155" width="6" height="235" rx="3" fill="#b6a4ef"/><circle cx="931" cy="187" r="15" fill="#b6a4ef" opacity=".18"/><text x="931" y="193" text-anchor="middle" fill="#b6a4ef" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">4</text><text x="923" y="237" fill="#f2f6fb" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">Quotas &amp; control</text><text x="923" y="280" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="16">CPU · queue · memory</text><text x="923" y="311" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="16">Cancellation · audit</text><rect x="34" y="422" width="1132" height="42" rx="10" fill="#122b35" stroke="#37635f"/><text x="600" y="449" text-anchor="middle" fill="#a9e5db" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">No single boundary substitutes for the others; test hostile workloads at each layer.</text></svg>