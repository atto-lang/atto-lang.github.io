<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc"><title id="title">From language meaning to execution</title><desc id="desc">Each layer has a separate contract; evidence at one layer does not prove the next. Semantics must be specified before backend behavior can be judged.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1526"/><stop offset="1" stop-color="#101f32"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#80cfc3" stroke-width="1.5"/></marker></defs><rect width="1200" height="490" rx="24" fill="url(#bg)"/><text x="44" y="62" fill="#e8f0f7" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">From language meaning to execution</text><text x="44" y="96" fill="#a9bacd" font-family="Inter,Arial,sans-serif" font-size="17">Each layer has a separate contract; evidence at one layer does not prove the next.</text><rect x="34" y="155" width="265" height="235" rx="17" fill="#163344" stroke="#40566e" stroke-width="1.5"/><rect x="34" y="155" width="6" height="235" rx="3" fill="#73d7c7"/><circle cx="64" cy="187" r="15" fill="#73d7c7" opacity=".18"/><text x="64" y="193" text-anchor="middle" fill="#73d7c7" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">1</text><text x="56" y="237" fill="#f2f6fb" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700">Language contract</text><text x="56" y="280" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="16">Syntax · types · effects</text><text x="56" y="311" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="16">Ownership · observable behavior</text><path d="M304 273 H317" stroke="#80cfc3" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="323" y="155" width="265" height="235" rx="17" fill="#1b3048" stroke="#40566e" stroke-width="1.5"/><rect x="323" y="1