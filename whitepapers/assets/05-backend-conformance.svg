<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc"><title id="title">One semantic contract, multiple backends</title><desc id="desc">Backends may use different mechanisms while preserving the same observable language behavior. Compilation is not parity: conformance requires equivalent guest-level evidence.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1526"/><stop offset="1" stop-color="#101f32"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#80cfc3" stroke-width="1.5"/></marker></defs><rect width="1200" height="490" rx="24" fill="url(#bg)"/><text x="44" y="62" fill="#e8f0f7" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">One semantic contract, multiple backends</text><text x="44" y="96" fill="#a9bacd" font-family="Inter,Arial,sans-serif" font-size="17">Backends may use different mechanisms while preserving the same observable language behavior.</text><rect x="34" y="155" width="215.2" height="235" rx="17" fill="#163344" stroke="#40566e" stroke-width="1.5"/><rect x="34" y="155" width="6" height="235" rx="3" fill="#73d7c7"/><circle cx="64" cy="187" r="15" fill="#73d7c7" opacity=".18"/><text x="64" y="193" text-anchor="middle" fill="#73d7c7" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">1</text><text x="56" y="237" fill="#f2f6fb" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Canonical spec</text><text x="56" y="280" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="15">Normative rules</text><text x="56" y="311" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="15">Shared fixtures</text><path d="M254.2 273 H257.2" stroke="#80cfc3" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="263.2" y="155" width="215.2" height="235" rx="17" fill="#1b3048" stroke="#40566e" stroke-width="1.5"/><rect x="263.2" y="155" width="6" height="235" rx="3" fill="#91b8ff"/><circle cx="293.2" cy="187" r="15" fill="#91b8ff" opacity=".18"/><text x="293.2" y="193" text-anchor="middle" fill="#91b8ff" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">2</text><text x="285.2" y="237" fill="#f2f6fb" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Java / LLVM</text><text x="285.2" y="280" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="15">Managed + native</text><text x="285.2" y="311" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="15">ABI adapters</text><path d="M483.4 273 H486.4" stroke="#80cfc3" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="492.4" y="155" width="215.2" height="235" rx="17" fill="#203548" stroke="#40566e" stroke-width="1.5"/><rect x="492.4" y="155" width="6" height="235" rx="3" fill="#e1b36e"/><circle cx="522.4" cy="187" r="15" fill="#e1b36e" opacity=".18"/><text x="522.4" y="193" text-anchor="middle" fill="#e1b36e" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">3</text><text x="514.4" y="237" fill="#f2f6fb" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">.NET / Wasm</text><text x="514.4" y="280" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="15">NativeAOT + guest</text><text x="514.4" y="311" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="15">Host capability limits</text><path d="M712.5999999999999 273 H715.5999999999999" stroke="#80cfc3" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="721.5999999999999" y="155" width="215.2" height="235" rx="17" fill="#29334a" stroke="#40566e" stroke-width="1.5"/><rect x="721.5999999999999" y="155" width="6" height="235" rx="3" fill="#b6a4ef"/><circle cx="751.5999999999999" cy="187" r="15" fill="#b6a4ef" opacity=".18"/><text x="751.5999999999999" y="193" text-anchor="middle" fill="#b6a4ef" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">4</text><text x="743.5999999999999" y="237" fill="#f2f6fb" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Forge / Cranelift</text><text x="743.5999999999999" y="280" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="15">Target lowering</text><text x="743.5999999999999" y="311" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="15">Runtime adapters</text><path d="M941.8 273 H944.8" stroke="#80cfc3" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="950.8" y="155" width="215.2" height="235" rx="17" fill="#283e41" stroke="#40566e" stroke-width="1.5"/><rect x="950.8" y="155" width="6" height="235" rx="3" fill="#81c6dc"/><circle cx="980.8" cy="187" r="15" fill="#81c6dc" opacity=".18"/><text x="980.8" y="193" text-anchor="middle" fill="#81c6dc" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">5</text><text x="972.8" y="237" fill="#f2f6fb" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700">Conformance</text><text x="972.8" y="280" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="15">Same fixtures</text><text x="972.8" y="311" fill="#bdcada" font-family="Inter,Arial,sans-serif" font-size="15">Exact-head guest receipts</text><rect x="34" y="422" width="1132" height="42" rx="10" fill="#122b35" stroke="#37635f"/><text x="600" y="449" text-anchor="middle" fill="#a9e5db" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">Compilation is not parity: conformance requires equivalent guest-level evidence.</text></svg>